name: Build downstream NX563J kernel

on:
  push:
    paths:
      - ".github/workflows/build-downstream.yml"
      - "patches/downstream/**"
  workflow_dispatch:
    inputs:
      kernel_ref:
        description: Kernel commit, branch or tag
        required: true
        default: cda6a278ffa94c5a6aa428c4ab98b8ba0356c0d6
      defconfig:
        description: Kernel defconfig
        required: true
        default: lineageos_nx563j_defconfig

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      KERNEL_REF: ${{ inputs.kernel_ref || 'cda6a278ffa94c5a6aa428c4ab98b8ba0356c0d6' }}
      DEFCONFIG: ${{ inputs.defconfig || 'lineageos_nx563j_defconfig' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             bc bison build-essential ccache curl flex git libelf-dev             libssl-dev python3 unzip wget xz-utils zip

      - name: Download Android toolchains
        run: |
          mkdir -p work/toolchains/clang work/toolchains/gcc64 work/toolchains/gcc32
          wget -q             https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/android13-mainline-go-adbd-release/clang-r450784d.tar.gz             -O work/clang.tar.gz
          tar -xzf work/clang.tar.gz -C work/toolchains/clang

          wget -q             https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz             -O work/gcc64.tar.gz
          tar -xzf work/gcc64.tar.gz -C work/toolchains/gcc64

          wget -q             https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9/+archive/refs/tags/android-12.1.0_r27.tar.gz             -O work/gcc32.tar.gz
          tar -xzf work/gcc32.tar.gz -C work/toolchains/gcc32

      - name: Fetch pinned LineageOS kernel
        run: |
          mkdir -p work/kernel
          git -C work/kernel init -q
          git -C work/kernel remote add origin \
            https://github.com/LineageOS/android_kernel_nubia_msm8998.git
          git -C work/kernel fetch --depth=1 origin "$KERNEL_REF"
          git -C work/kernel checkout --detach FETCH_HEAD
          actual_commit="$(git -C work/kernel rev-parse HEAD)"
          echo "KERNEL_COMMIT=$actual_commit" >> "$GITHUB_ENV"
          echo "Kernel source commit: $actual_commit" >> "$GITHUB_STEP_SUMMARY"
          source_epoch="$(git -C work/kernel show -s --format=%ct HEAD)"
          source_timestamp="$(LC_ALL=C date -u -d "@$source_epoch" '+%a %b %e %T UTC %Y')"
          {
            echo "SOURCE_DATE_EPOCH=$source_epoch"
            echo "KBUILD_BUILD_TIMESTAMP=$source_timestamp"
            echo "KBUILD_BUILD_USER=nx563j-ci"
            echo "KBUILD_BUILD_HOST=github-actions"
            echo "KBUILD_BUILD_VERSION=1"
          } >> "$GITHUB_ENV"
          echo "Reproducible Kbuild timestamp: $source_timestamp" >> "$GITHUB_STEP_SUMMARY"

      - name: Apply downstream compatibility patches
        working-directory: work/kernel
        run: |
          git apply "$GITHUB_WORKSPACE/patches/downstream/0001-backport-scoped-guard-lock-pointer.patch"

      - name: Configure
        working-directory: work/kernel
        run: |
          export PATH="$GITHUB_WORKSPACE/work/toolchains/clang/bin:$GITHUB_WORKSPACE/work/toolchains/gcc32/bin:$PATH"
          make -j"$(nproc)" O=out ARCH=arm64             CLANG_TRIPLE=aarch64-linux-gnu-             CROSS_COMPILE="$GITHUB_WORKSPACE/work/toolchains/gcc64/bin/aarch64-linux-android-"             CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/work/toolchains/gcc32/bin/arm-linux-androideabi-"             CROSS_COMPILE_COMPAT="$GITHUB_WORKSPACE/work/toolchains/gcc32/bin/arm-linux-androideabi-"             CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1             CLANG_TARGET_ARM32="--target=arm-linux-androideabi -B$GITHUB_WORKSPACE/work/toolchains/gcc32/bin"             "$DEFCONFIG"

      - name: Build
        working-directory: work/kernel
        shell: bash
        run: |
          set +e
          export PATH="$GITHUB_WORKSPACE/work/toolchains/clang/bin:$PATH"
          mkdir -p "$GITHUB_WORKSPACE/artifacts/downstream"
          make -j"$(nproc)" O=out ARCH=arm64             CLANG_TRIPLE=aarch64-linux-gnu-             CROSS_COMPILE="$GITHUB_WORKSPACE/work/toolchains/gcc64/bin/aarch64-linux-android-"             CROSS_COMPILE_ARM32="$GITHUB_WORKSPACE/work/toolchains/gcc32/bin/arm-linux-androideabi-"             CROSS_COMPILE_COMPAT="$GITHUB_WORKSPACE/work/toolchains/gcc32/bin/arm-linux-androideabi-"             CC=clang LD=ld.lld LLVM=1 LLVM_IAS=1             CLANG_TARGET_ARM32="--target=arm-linux-androideabi -B$GITHUB_WORKSPACE/work/toolchains/gcc32/bin"             2>&1 | tee "$GITHUB_WORKSPACE/artifacts/downstream/build.log"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "Kernel build failed with exit code $rc"
            grep -E -i "error:|fatal:|undefined reference|cannot find|unrecognized|unsupported|ld:|make\\[[0-9]+\\].*\\*\\*\\*" "$GITHUB_WORKSPACE/artifacts/downstream/build.log" | tail -n 30 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit "$rc"
          fi
      - name: Collect artifacts
        run: |
          mkdir -p artifacts/downstream
          printf '%s\n' "$KERNEL_REF" > artifacts/downstream/KERNEL_REQUESTED_REF
          printf '%s\n' "$KERNEL_COMMIT" > artifacts/downstream/KERNEL_SOURCE_COMMIT
          cp work/kernel/out/arch/arm64/boot/Image.gz-dtb artifacts/downstream/
          cp work/kernel/out/.config artifacts/downstream/kernel.config
          find work/kernel/out/arch -type f -name '*NX563J*.dtb' -exec cp {} artifacts/downstream/ \; || true
          sha256sum artifacts/downstream/* | tee artifacts/downstream/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: nx563j-downstream-${{ env.KERNEL_REF }}
          path: artifacts/downstream/
          if-no-files-found: error
