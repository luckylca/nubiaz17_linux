name: Build mainline-oriented NX563J kernel

on:
  push:
    paths:
      - ".github/workflows/build-mainline.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Source commit, branch or tag
        required: true
        default: a07b78d3526376cfb8ef136bd0fa279163ac5e3f
      defconfig:
        description: Kernel defconfig
        required: true
        default: nx563j_oh_defconfig

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SOURCE_REF: ${{ inputs.source_ref || 'a07b78d3526376cfb8ef136bd0fa279163ac5e3f' }}
      DEFCONFIG: ${{ inputs.defconfig || 'nx563j_oh_defconfig' }}

    steps:
      - uses: actions/checkout@v4

      - name: Install cross-build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y             bc bison build-essential device-tree-compiler flex gcc-aarch64-linux-gnu             libelf-dev libssl-dev python3 rsync

      - name: Fetch pinned NX563J mainline-oriented tree
        run: |
          mkdir -p work/kernel
          git -C work/kernel init -q
          git -C work/kernel remote add origin \
            https://github.com/LemonFan-maker/MSM8998-OH-KERNEL-6.0.git
          git -C work/kernel fetch --depth=1 origin "$SOURCE_REF"
          git -C work/kernel checkout --detach FETCH_HEAD
          actual_commit="$(git -C work/kernel rev-parse HEAD)"
          echo "SOURCE_COMMIT=$actual_commit" >> "$GITHUB_ENV"
          echo "Kernel source commit: $actual_commit" >> "$GITHUB_STEP_SUMMARY"
          source_epoch="$(git -C work/kernel show -s --format=%ct HEAD)"
          source_timestamp="$(LC_ALL=C date -u -d "@$source_epoch" '+%a %b %e %T UTC %Y')"
          {
            echo "SOURCE_DATE_EPOCH=$source_epoch"
            echo "KBUILD_BUILD_TIMESTAMP=$source_timestamp"
            echo "KBUILD_BUILD_USER=nx563j-ci"
            echo "KBUILD_BUILD_HOST=github-actions"
            echo "KBUILD_BUILD_VERSION=1"
          } >> "$GITHUB_ENV"
          echo "Reproducible Kbuild timestamp: $source_timestamp" >> "$GITHUB_STEP_SUMMARY"

      - name: Configure
        working-directory: work/kernel
        run: |
          make ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- "$DEFCONFIG"

      - name: Build kernel and DTBs
        working-directory: work/kernel
        run: |
          make -j"$(nproc)" ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- Image.gz dtbs

      - name: Collect artifacts
        run: |
          mkdir -p artifacts/mainline
          printf '%s\n' "$SOURCE_REF" > artifacts/mainline/KERNEL_REQUESTED_REF
          printf '%s\n' "$SOURCE_COMMIT" > artifacts/mainline/KERNEL_SOURCE_COMMIT
          cp work/kernel/arch/arm64/boot/Image.gz artifacts/mainline/
          cp work/kernel/.config artifacts/mainline/kernel.config
          find work/kernel/arch/arm64/boot/dts/qcom -type f             \( -name 'msm8998-nubia-nx563j.dtb' -o -name '*nx563j*.dtb' \)             -exec cp {} artifacts/mainline/ \;
          sha256sum artifacts/mainline/* | tee artifacts/mainline/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: nx563j-mainline-oriented
          path: artifacts/mainline/
          if-no-files-found: error
