# NX563J X11 config — fbdev video on /dev/fb0 (JDI R63452 cmd-mode panel,
# 1080x1920 portrait) + synaptics dsx touch (event4) via evdev.
#
# The downstream 4.4 kernel exposes no DRM/KMS for mdss and the KGSL GPU
# has no Linux userspace, so everything is CPU-rendered through fbdev.
# Touch coordinates are panel-native portrait (verified: X=429, Y=401 in
# range), so no transformation matrix is needed.

Section "ServerLayout"
    Identifier "nx563j"
    Screen "screen0"
    InputDevice "touch0" "CorePointer"
EndSection

Section "ServerFlags"
    # No udev on this box (no systemd): modern Xorg discovers hotplug
    # input devices exclusively through udev, so without it ZERO input
    # devices appear (xinput shows only the virtual core). Bind the
    # synaptics statically instead.
    Option "AutoAddDevices" "no"
EndSection

Section "InputDevice"
    Identifier "touch0"
    # evdev, not libinput: libinput refuses to work without udev
    # ("udev device never initialized" -> "Invalid path") and we have no
    # udev (no systemd). evdev attaches the synaptics as a core pointer;
    # the "[dix] touch0: unable to find touch point 0" spam is the XI2.2
    # MT path complaining, plain tap-as-click still works through it.
    Driver "evdev"
    Option "Device" "/dev/input/event4"
    # evdev misdetects the rmi4 MT device as an absolute *touchpad*
    # ("Found absolute touchpad" -> relative motion, no real buttons, so
    # taps never click). Force absolute touchscreen mode: the tap position
    # IS the pointer position and the tap is button 1.
    Option "Mode" "Absolute"
    Option "GrabDevice" "yes"
EndSection

Section "Device"
    Identifier "fbdev0"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection

Section "Monitor"
    Identifier "panel"
EndSection

Section "Screen"
    Identifier "screen0"
    Device "fbdev0"
    Monitor "panel"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1080x1920"
    EndSubSection
EndSection
