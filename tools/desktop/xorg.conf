# NX563J X11 config — fbdev video on /dev/fb0 (JDI R63452 cmd-mode panel,
# 1080x1920 portrait) + synaptics dsx touch (event4) via evdev.
#
# The downstream 4.4 kernel exposes no DRM/KMS for mdss and the KGSL GPU
# has no Linux userspace, so everything is CPU-rendered through fbdev.
# Touch coordinates are panel-native portrait (verified: X=429, Y=401 in
# range), so no transformation matrix is needed.

Section "ServerLayout"
    Identifier "nx563j"
    Screen "screen0"
    InputDevice "touch0" "CorePointer"
EndSection

Section "ServerFlags"
    # No udev on this box (no systemd): modern Xorg discovers hotplug
    # input devices exclusively through udev, so without it ZERO input
    # devices appear (xinput shows only the virtual core). Bind the
    # synaptics statically instead.
    Option "AutoAddDevices" "no"
    # Touch HMI kiosk: never blank/DPMS the panel. DPMS-off makes fbdev
    # FBIOBLANK the panel and clears mdss autorefresh -> black screen
    # that needs a manual unblank+kick to recover (hit after 600 s idle).
    Option "BlankTime" "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime" "0"
EndSection

Section "InputDevice"
    Identifier "touch0"
    # evdev, not libinput: libinput refuses to work without udev
    # ("udev device never initialized" -> "Invalid path") and we have no
    # udev (no systemd).
    #
    # This is NOT the raw rmi4 device: the raw one advertises
    # BTN_TOOL_FINGER, so evdev classifies it as an absolute *touchpad*
    # and drops BTN_TOUCH (taps moved the pointer but never clicked).
    # touch-forward (started by desktop.sh) grabs event4 and re-emits a
    # minimal single-touch stream on this uinput clone — no
    # BTN_TOOL_FINGER, no MT slots — so evdev takes the touchscreen path:
    # tap position = pointer position, tap = button 1.
    Driver "evdev"
    Option "Device" "/dev/input/nx563j-touch"
    Option "Mode" "Absolute"
    Option "GrabDevice" "yes"
EndSection

Section "Device"
    Identifier "fbdev0"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection

Section "Monitor"
    Identifier "panel"
EndSection

Section "Screen"
    Identifier "screen0"
    Device "fbdev0"
    Monitor "panel"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1080x1920"
    EndSubSection
EndSection
