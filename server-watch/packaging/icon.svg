<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141b2b"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.06"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>
  <!-- glass dial -->
  <circle cx="256" cy="256" r="150" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="2"/>
  <!-- clock hands -->
  <line x1="256" y1="256" x2="256" y2="168" stroke="#eef2fa" stroke-width="14" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="318" y2="296" stroke="#eef2fa" stroke-width="14" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="12" fill="#8ab4f8"/>
  <!-- status dot -->
  <circle cx="376" cy="376" r="26" fill="#7ee2a8"/>
</svg>
